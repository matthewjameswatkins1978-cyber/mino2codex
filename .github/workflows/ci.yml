name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Nushell
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            curl --fail --silent --show-error --location \
              https://github.com/nushell/nushell/releases/download/0.115.1/nu-0.115.1-x86_64-pc-windows-msvc.zip \
              --output nu.zip
            7z x -y nu.zip
          else
            curl --fail --silent --show-error --location \
              https://github.com/nushell/nushell/releases/download/0.115.1/nu-0.115.1-x86_64-unknown-linux-gnu.tar.gz \
              --output nu.tar.gz
            tar -xzf nu.tar.gz
            mv nu-0.115.1-x86_64-unknown-linux-gnu/nu ./nu
          fi
      - name: Run Nu tests
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then ./nu.exe tests/run.nu; else ./nu tests/run.nu; fi
